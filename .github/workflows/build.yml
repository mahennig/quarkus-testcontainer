name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Docker is available on GitHub-hosted Ubuntu runners, which Testcontainers and Dev Services need.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle dependencies and wrapper distributions.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build
