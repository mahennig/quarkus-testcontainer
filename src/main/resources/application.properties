# PostgreSQL
quarkus.datasource.db-kind = postgresql
# dev/test: no URL or credentials here, so Dev Services start a PostgreSQL container.
quarkus.datasource.devservices.image-name = postgres:18
# prod: everything comes from the environment.
%prod.quarkus.datasource.jdbc.url = ${DB_JDBC_URL}
%prod.quarkus.datasource.username = ${DB_USERNAME}
%prod.quarkus.datasource.password = ${DB_PASSWORD}

# Flyway is the source of truth for the schema; Hibernate only validates it.
quarkus.flyway.migrate-at-start = true
quarkus.flyway.locations = db/migration
%dev,test.quarkus.flyway.locations = db/migration,db/seed
quarkus.hibernate-orm.schema-management.strategy = validate

# MongoDB
quarkus.mongodb.database = app
# dev/test: no connection string, so Dev Services start a MongoDB container.
quarkus.mongodb.devservices.image-name = mongo:8.0
%prod.quarkus.mongodb.connection-string = ${MONGODB_CONNECTION_STRING}

# S3 user export (AWS SDK v2). Without app.aws.endpoint the SDK talks to AWS and uses the
# default credentials provider chain; tests point it at a Floci container.
app.aws.region = us-east-1
app.aws.export-bucket = user-exports
